<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#800020"/>
      <stop offset="1" stop-color="#4A0E1A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9CF9A"/>
      <stop offset="0.5" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#B8860B"/>
    </linearGradient>
  </defs>
  <rect width="400" height="480" fill="url(#bg)"/>

  <!-- ornamental inner frame -->
  <rect x="16" y="16" width="368" height="448" rx="10" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.85"/>
  <rect x="24" y="24" width="352" height="432" rx="7" fill="none" stroke="url(#gold)" stroke-width="0.75" opacity="0.5"/>

  <!-- filigree corner flourishes -->
  <g stroke="url(#gold)" stroke-width="1.2" fill="none" opacity="0.8">
    <path d="M36 36c10 0 10 12 10 12s0-12 10-12"/>
    <path d="M364 36c-10 0-10 12-10 12s0-12-10-12"/>
    <path d="M36 444c10 0 10-12 10-12s0 12 10 12"/>
    <path d="M364 444c-10 0-10-12-10-12s0 12-10 12"/>
  </g>

  <!-- silhouette of a woman in headwrap, gazing right -->
  <g fill="url(#gold)" opacity="0.95">
    <path d="M200 118c-26 0-46 22-46 48 0 15 7 29 18 38-24 10-40 34-40 62v12h136v-12c0-28-16-52-40-62 11-9 18-23 18-38 0-26-20-48-46-48z"/>
    <path d="M168 88c2-24 18-44 40-46-4 16 2 30 12 40-4 14-18 22-30 20-14-1-24-8-22-14z"/>
  </g>

  <!-- necklace -->
  <path d="M190 226c6 8 24 8 30 0" stroke="#E9CF9A" stroke-width="2.5" fill="none"/>
  <circle cx="205" cy="234" r="4" fill="#E9CF9A"/>
  <circle cx="215" cy="234" r="2.5" fill="#E9CF9A"/>

  <!-- ruby between hands -->
  <path d="M186 320h28l-4 26h-20z" fill="#E9CF9A" opacity="0.9"/>

  <!-- monogram -->
  <text x="200" y="412" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="bold" fill="url(#gold)" letter-spacing="6">MSS</text>
  <text x="200" y="434" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#E9CF9A" letter-spacing="4" opacity="0.9">RUBY JUBILEE</text>
</svg>
